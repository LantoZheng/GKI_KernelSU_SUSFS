name: Build GKI A15 6.6.77 (KSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'AOSP Kernel Manifest URL'
        required: true
        default: 'https://android.googlesource.com/kernel/manifest'
      MANIFEST_BRANCH:
        description: 'AOSP Branch or Tag (e.g., common-android15-6.6)'
        required: true
        default: 'common-android15-6.6'
      KSU_MANAGER_VER:
        description: 'KernelSU Manager Version Override'
        required: true
        default: '40545'

jobs:
  build:
    name: Build GKI A15 6.6
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git python3 libssl-dev zip unzip repo cpio rsync

          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Sync GKI 6.6 Source
        run: |
          mkdir -p android-kernel && cd android-kernel
          # 使用 --depth=1 节省空间和同步时间。如果需要 6.6.77 的特定 ASB Tag，可以在触发时修改 MANIFEST_BRANCH
          repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --no-tags --force-sync

      - name: Integrate KernelSU & Override Manager Version
        run: |
          cd android-kernel/common
          
          # 拉取 KernelSU 源码
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

          # 针对指定版本管理器进行硬编码适配
          cd KernelSU
          echo "Overriding KernelSU version to ${{ github.event.inputs.KSU_MANAGER_VER }}"
          echo "${{ github.event.inputs.KSU_MANAGER_VER }}" > VERSION
          
          # 修复点 1：覆盖官方的版本号获取脚本（最稳定的方法）
          echo "#!/bin/bash" > scripts/ksu_version.sh
          echo "echo ${{ github.event.inputs.KSU_MANAGER_VER }}" >> scripts/ksu_version.sh
          chmod +x scripts/ksu_version.sh
          
          # 修复点 2：指定正确的路径 (kernel/Makefile) 替换变量
          sed -i 's/ccflags-y += -DKSU_VERSION=.*/ccflags-y += -DKSU_VERSION=\"${{ github.event.inputs.KSU_MANAGER_VER }}\"/' kernel/Makefile
          sed -i 's/$(shell.*)/${{ github.event.inputs.KSU_MANAGER_VER }}/g' kernel/Makefile
          
          cd ..

      - name: Integrate SUSFS
        run: |
          # 假设当前 GitHub 仓库中包含 susfs 的源码/补丁目录 (与 LantoZheng 仓库结构类似)
          # 复制 SUSFS 源码到内核树
          cp -r ${GITHUB_WORKSPACE}/susfs/kernel_patches/fs/* android-kernel/common/fs/
          cp -r ${GITHUB_WORKSPACE}/susfs/kernel_patches/include/linux/* android-kernel/common/include/linux/
          
          cd android-kernel/common
          
          # 应用 SUSFS 针对 Kernel 6.6 的补丁
          echo "Applying SUSFS 6.6 patches..."
          patch -p1 < ${GITHUB_WORKSPACE}/susfs/kernel_patches/50_recipe_susfs.patch
          patch -p1 < ${GITHUB_WORKSPACE}/susfs/kernel_patches/susfs_core.patch
          
          # 如果有专门针对 KernelSU 的 SUSFS 钩子补丁，也在此处应用
          # patch -p1 < ${GITHUB_WORKSPACE}/susfs/kernel_patches/susfs_ksu.patch

      - name: Build Kernel (Bazel / Kleaf)
        run: |
          cd android-kernel
          # A15 6.6 必须使用 Bazel 进行构建
          echo "Starting Bazel build..."
          tools/bazel run //common:kernel_aarch64_dist -- --destdir out/dist

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          
          # 复制生成的 Image 文件
          cp android-kernel/out/dist/Image ak3/
          
          cd ak3
          # 移除不必要的文件
          rm -rf .git README.md *placeholder
          
          # 打包
          zip -r9 ../GKI-6.6.77-KSU_${{ github.event.inputs.KSU_MANAGER_VER }}-SUSFS.zip *

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6.77-KSU-40545-SUSFS
          path: GKI-6.6.77-KSU_${{ github.event.inputs.KSU_MANAGER_VER }}-SUSFS.zip
