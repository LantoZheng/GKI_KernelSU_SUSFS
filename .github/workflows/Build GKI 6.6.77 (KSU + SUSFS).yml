name: Build GKI 6.6.77 (KSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel Version Tag (e.g., ASB-2024-05-05_15-6.6)'
        required: true
        default: 'common-android15-6.6'
      ksu_manager_version:
        description: 'KernelSU Manager Version'
        required: true
        default: '40545'

jobs:
  build-kernel:
    name: Build GKI 6.6.77
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git python3 libssl-dev zip unzip repo
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Sync GKI Source (6.6)
        run: |
          mkdir -p workspace && cd workspace
          # 使用 Android 15 6.6 的通用分支，你可以将 input 替换为 6.6.77 的具体 tag
          repo init -u https://android.googlesource.com/kernel/manifest -b ${{ github.event.inputs.kernel_version }} --depth=1
          repo sync -c -j$(nproc --all) --no-tags --force-sync

      - name: Setup KernelSU & SUSFS
        run: |
          cd workspace/common
          
          # 1. 引入 KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # 2. 强制修改 KernelSU 版本以适配 40545 管理器
          cd KernelSU
          echo "${{ github.event.inputs.ksu_manager_version }}" > VERSION
          # 替换 Makefile 中的版本号逻辑，强制返回 40545
          sed -i 's/$(shell.*)/${{ github.event.inputs.ksu_manager_version }}/g' Makefile
          cd ..

          # 3. 引入 SUSFS 补丁
          # 注意：请根据你当前仓库 /assets/ 或 /scripts/ 目录下的 SUSFS 补丁路径进行调整
          echo "Applying SUSFS patches..."
          # 假设你的仓库根目录下有 susfs 补丁，此处将补丁复制并应用
          # cp ../../susfs_patches/*.patch ./
          # patch -p1 < susfs_core.patch

      - name: Build Kernel
        run: |
          cd workspace
          # 编译 aarch64 架构的 GKI
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j$(nproc --all)

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp workspace/out/mixed/dist/Image ak3/
          cd ak3
          zip -r9 ../GKI-6.6.77-KernelSU-${{ github.event.inputs.ksu_manager_version }}-SUSFS.zip * -x .git README.md *placeholder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6.77-KSU-40545-SUSFS
          path: GKI-6.6.77-KernelSU-*.zip
